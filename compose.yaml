# CMGI Apps — production-style stack (also usable locally with Docker Desktop).
#   cp .env.example .env   # set EVENTPASS_ADMIN_PASSWORD at least
#   docker compose up -d --build
# Data lives in named volumes and survives restarts, rebuilds and deployments.

name: cmgi-apps

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_CONTACT_PHONE: ${VITE_CONTACT_PHONE:-}
        VITE_CONTACT_ADDRESS: ${VITE_CONTACT_ADDRESS:-}
        VITE_ORGANISATION_NAME: ${VITE_ORGANISATION_NAME:-CMGI}
    image: cmgi-apps/web:${CMGI_VERSION:-local}
    restart: unless-stopped
    environment:
      CMGI_SITE_ADDRESS: ${CMGI_SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data        # TLS certificates — keep, or Let's Encrypt rate limits may hit
      - caddy_config:/config
    depends_on:
      eventpass-api:
        condition: service_healthy
      sermon-api:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

  eventpass-api:
    build: ./apps/eventpass/backend
    image: cmgi-apps/eventpass-api:${CMGI_VERSION:-local}
    restart: unless-stopped
    environment:
      EVENTPASS_ADMIN_PASSWORD: ${EVENTPASS_ADMIN_PASSWORD:?Set EVENTPASS_ADMIN_PASSWORD in .env}
      EVENTPASS_TIMEZONE: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
      EVENTPASS_ORIGIN: ${EVENTPASS_ORIGIN:-}
      EVENTPASS_PUBLIC_URL: ${EVENTPASS_PUBLIC_URL:-}
      EVENTPASS_SMTP_HOST: ${EVENTPASS_SMTP_HOST:-}
      EVENTPASS_SMTP_PORT: ${EVENTPASS_SMTP_PORT:-587}
      EVENTPASS_SMTP_SECURITY: ${EVENTPASS_SMTP_SECURITY:-starttls}
      EVENTPASS_SMTP_USER: ${EVENTPASS_SMTP_USER:-}
      EVENTPASS_SMTP_PASSWORD: ${EVENTPASS_SMTP_PASSWORD:-}
      EVENTPASS_MAIL_FROM: ${EVENTPASS_MAIL_FROM:-}
      EVENTPASS_MAIL_REPLY_TO: ${EVENTPASS_MAIL_REPLY_TO:-}
      TZ: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
    volumes:
      - eventpass_data:/data    # eventpass.sqlite3, badge_assets/, backups/
    expose: ["8000"]
    mem_limit: 256m
    logging: *logging

  sermon-api:
    build: ./apps/sermon-ai/backend
    image: cmgi-apps/sermon-api:${CMGI_VERSION:-local}
    restart: unless-stopped
    environment:
      SERMON_ADMIN_PASSWORD: ${SERMON_ADMIN_PASSWORD:?Set SERMON_ADMIN_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERMON_CLAUDE_MODEL: ${SERMON_CLAUDE_MODEL:-claude-opus-5-5}
      SERMON_TRANSCRIBE_MODEL: ${SERMON_TRANSCRIBE_MODEL:-whisper-1}
      TZ: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
    volumes:
      - sermon_data:/data       # sermon.sqlite3, audio/, backups/
    expose: ["8000"]
    mem_limit: 256m
    logging: *logging

volumes:
  eventpass_data:
  sermon_data:
  caddy_data:
  caddy_config:
