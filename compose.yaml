# CMGI Apps — production-style stack (also usable locally with Docker Desktop).
#   cp .env.example .env   # set EVENTPASS_ADMIN_PASSWORD at least
#   docker compose up -d --build
# Data lives in named volumes and survives restarts, rebuilds and deployments.

name: cmgi-apps

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_CONTACT_PHONE: ${VITE_CONTACT_PHONE:-}
        VITE_CONTACT_ADDRESS: ${VITE_CONTACT_ADDRESS:-}
        VITE_ORGANISATION_NAME: ${VITE_ORGANISATION_NAME:-CMGI}
    image: cmgi-apps/web:${CMGI_VERSION:-local}
    restart: unless-stopped
    environment:
      CMGI_SITE_ADDRESS: ${CMGI_SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data        # TLS certificates — keep, or Let's Encrypt rate limits may hit
      - caddy_config:/config
    depends_on:
      accounts-api:
        condition: service_healthy
      eventpass-api:
        condition: service_healthy
      sermon-api:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

  eventpass-api:
    build: ./apps/eventpass/backend
    image: cmgi-apps/eventpass-api:${CMGI_VERSION:-local}
    restart: unless-stopped
    environment:
      EVENTPASS_ADMIN_PASSWORD: ${EVENTPASS_ADMIN_PASSWORD:?Set EVENTPASS_ADMIN_PASSWORD in .env}
      EVENTPASS_TIMEZONE: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
      EVENTPASS_ORIGIN: ${EVENTPASS_ORIGIN:-}
      EVENTPASS_PUBLIC_URL: ${EVENTPASS_PUBLIC_URL:-}
      # Database "eventpass" in the central PostgreSQL (an existing SQLite file is imported once).
      EVENTPASS_DATABASE_URL: postgresql://eventpass:${EVENTPASS_DB_PASSWORD:?Set EVENTPASS_DB_PASSWORD in .env}@db:5432/eventpass
      # Central CMGI login: who is signed in, Pro of event owners.
      ACCOUNTS_URL: http://accounts-api:8000/api/accounts
      ACCOUNTS_INTERNAL_KEY: ${ACCOUNTS_INTERNAL_KEY:?Set ACCOUNTS_INTERNAL_KEY in .env}
      EVENTPASS_LEGACY_ADMIN: ${EVENTPASS_LEGACY_ADMIN:-true}
      EVENTPASS_SMTP_HOST: ${EVENTPASS_SMTP_HOST:-}
      EVENTPASS_SMTP_PORT: ${EVENTPASS_SMTP_PORT:-587}
      EVENTPASS_SMTP_SECURITY: ${EVENTPASS_SMTP_SECURITY:-starttls}
      EVENTPASS_SMTP_USER: ${EVENTPASS_SMTP_USER:-}
      EVENTPASS_SMTP_PASSWORD: ${EVENTPASS_SMTP_PASSWORD:-}
      EVENTPASS_MAIL_FROM: ${EVENTPASS_MAIL_FROM:-}
      EVENTPASS_MAIL_REPLY_TO: ${EVENTPASS_MAIL_REPLY_TO:-}
      TZ: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
    volumes:
      - eventpass_data:/data    # badge_assets/, backups/ (and the old eventpass.sqlite3, kept as fallback)
    depends_on:
      db-setup:
        condition: service_completed_successfully
    expose: ["8000"]
    mem_limit: 256m
    logging: *logging

  # ---- CMGI Accounts: one login for all apps, Pro access, AI credits ----
  accounts-api:
    build: ./apps/accounts/backend
    image: cmgi-apps/accounts-api:${CMGI_VERSION:-local}
    restart: unless-stopped
    environment:
      ACCOUNTS_DATABASE_URL: postgresql+psycopg://accounts:${ACCOUNTS_DB_PASSWORD:?Set ACCOUNTS_DB_PASSWORD in .env}@db:5432/accounts
      ACCOUNTS_INTERNAL_KEY: ${ACCOUNTS_INTERNAL_KEY:?Set ACCOUNTS_INTERNAL_KEY in .env}
      ACCOUNTS_PUBLIC_URL: ${CMGI_PUBLIC_URL:-}
      ACCOUNTS_SECURE_COOKIE: ${CMGI_SECURE_COOKIES:-false}
      CMGI_ADMIN_EMAILS: ${CMGI_ADMIN_EMAILS:-}
      # Online payment (Stripe). Empty = plans page says "opens soon"; the admin can still give Pro.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE: ${STRIPE_PRO_PRICE:-}
      STRIPE_PRO_LABEL: ${STRIPE_PRO_LABEL:-}
      STRIPE_MINUTE_PACKS: ${STRIPE_MINUTE_PACKS:-}
      # Same mail account as EventPass.
      SMTP_HOST: ${EVENTPASS_SMTP_HOST:-}
      SMTP_PORT: ${EVENTPASS_SMTP_PORT:-587}
      SMTP_SECURITY: ${EVENTPASS_SMTP_SECURITY:-starttls}
      SMTP_USER: ${EVENTPASS_SMTP_USER:-}
      SMTP_PASSWORD: ${EVENTPASS_SMTP_PASSWORD:-}
      MAIL_FROM: ${CMGI_MAIL_FROM:-${EVENTPASS_MAIL_FROM:-}}
      MAIL_REPLY_TO: ${EVENTPASS_MAIL_REPLY_TO:-}
      TZ: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    expose: ["8000"]
    mem_limit: 192m
    logging: *logging

  sermon-api:
    build: ./apps/sermon-ai/backend
    image: cmgi-apps/sermon-api:${CMGI_VERSION:-local}
    restart: unless-stopped
    environment:
      SERMON_ADMIN_PASSWORD: ${SERMON_ADMIN_PASSWORD:?Set SERMON_ADMIN_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERMON_CLAUDE_MODEL: ${SERMON_CLAUDE_MODEL:-claude-opus-5-5}
      SERMON_TRANSCRIBE_MODEL: ${SERMON_TRANSCRIBE_MODEL:-whisper-1}
      # Database "sermon" in the central PostgreSQL (an existing SQLite file is imported once).
      SERMON_DATABASE_URL: postgresql://sermon:${SERMON_DB_PASSWORD:?Set SERMON_DB_PASSWORD in .env}@db:5432/sermon
      # Central CMGI login; transcription is paid with the owner's AI minutes.
      ACCOUNTS_URL: http://accounts-api:8000/api/accounts
      ACCOUNTS_INTERNAL_KEY: ${ACCOUNTS_INTERNAL_KEY:?Set ACCOUNTS_INTERNAL_KEY in .env}
      SERMON_LEGACY_ADMIN: ${SERMON_LEGACY_ADMIN:-true}
      TZ: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
    volumes:
      - sermon_data:/data       # audio/, backups/ (and the old sermon.sqlite3, kept as fallback)
    depends_on:
      db-setup:
        condition: service_completed_successfully
    expose: ["8000"]
    mem_limit: 256m
    logging: *logging

  # ---- Body of Christ (separate repository: carls12/bodyofchrist-django) ----
  # Runs a published, fixed image version, so pushes to that repo never change the live site
  # by themselves. Switched off until enabled with COMPOSE_PROFILES=bodyofchrist in .env.
  bodyofchrist:
    image: ghcr.io/carls12/bodyofchrist-django:${BODYOFCHRIST_VERSION:-v0.2.0}
    profiles: ["bodyofchrist"]
    restart: unless-stopped
    environment:
      SECRET_KEY: ${BODYOFCHRIST_SECRET_KEY:-}
      TOTP_ENCRYPTION_KEY: ${BODYOFCHRIST_TOTP_ENCRYPTION_KEY:-}
      URL_PREFIX: bodyofchrist
      # Central CMGI login and Pro (cookie from the portal; see core/cmgi.py in the app repo).
      CMGI_ACCOUNTS_URL: http://accounts-api:8000/api/accounts
      CMGI_PORTAL_URL: /
      CMGI_INTERNAL_KEY: ${ACCOUNTS_INTERNAL_KEY:-}
      ALLOWED_HOSTS: ${BODYOFCHRIST_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SECURE_COOKIES: ${BODYOFCHRIST_SECURE_COOKIES:-False}
      CSRF_TRUSTED_ORIGINS: ${BODYOFCHRIST_CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bodyofchrist
      DB_USER: bodyofchrist
      DB_PASS: ${BODYOFCHRIST_DB_PASSWORD:-}
      SUPER_ADMIN_EMAIL: ${BODYOFCHRIST_SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_EMAILS: ${BODYOFCHRIST_SUPER_ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${BODYOFCHRIST_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${BODYOFCHRIST_GOOGLE_CLIENT_SECRET:-}
      APP_TIMEZONE: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
      # Same mail account as EventPass unless set separately.
      EMAIL_HOST: ${BODYOFCHRIST_EMAIL_HOST:-${EVENTPASS_SMTP_HOST:-}}
      EMAIL_PORT: ${BODYOFCHRIST_EMAIL_PORT:-${EVENTPASS_SMTP_PORT:-587}}
      EMAIL_HOST_USER: ${BODYOFCHRIST_EMAIL_USER:-${EVENTPASS_SMTP_USER:-}}
      EMAIL_HOST_PASSWORD: ${BODYOFCHRIST_EMAIL_PASSWORD:-${EVENTPASS_SMTP_PASSWORD:-}}
      DEFAULT_FROM_EMAIL: ${BODYOFCHRIST_MAIL_FROM:-${EVENTPASS_MAIL_FROM:-no-reply@bodyofchrist.local}}
      TZ: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
    volumes:
      - bodyofchrist_media:/data/media   # uploaded avatars
    depends_on:
      db-setup:
        condition: service_completed_successfully
    expose: ["8000"]
    mem_limit: 384m
    logging: *logging

  # ---- Central PostgreSQL: one server, one database + login per app ----
  # Not reachable from outside (no published port). Apps connect as their own login and
  # can only open their own database (see infrastructure/database/setup.sh).
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${EVENTPASS_TIMEZONE:-Europe/Berlin}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    logging: *logging

  # One-shot job on every start: creates missing app databases/logins, updates passwords.
  db-setup:
    image: postgres:17-alpine
    restart: "no"
    command: ["sh", "/setup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: postgres
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?Set ACCOUNTS_DB_PASSWORD in .env}
      EVENTPASS_DB_PASSWORD: ${EVENTPASS_DB_PASSWORD:?Set EVENTPASS_DB_PASSWORD in .env}
      SERMON_DB_PASSWORD: ${SERMON_DB_PASSWORD:?Set SERMON_DB_PASSWORD in .env}
      BODYOFCHRIST_DB_PASSWORD: ${BODYOFCHRIST_DB_PASSWORD:-}
    volumes:
      - ./infrastructure/database/setup.sh:/setup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  eventpass_data:
  sermon_data:
  bodyofchrist_media:
  db_data:
  caddy_data:
  caddy_config:
