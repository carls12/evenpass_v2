name: Mobile apps

# Builds the four Android + iOS apps in mobile-apps/ (CMGI Apps, EventPass, Sermon AI, Body of Christ).
# Each app shows the live website, so website changes do NOT need a new app build.
# Android: debug APK per app as a download (Actions -> this run -> Artifacts) to install on a phone.
# iOS: simulator build without signing (iPhones need the Apple certificates, see mobile-apps/README.md).
# Run it by hand with another address (e.g. your ngrok link) to test before the server is online.
on:
  push:
    branches: [main]
    paths: ["mobile-apps/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile-apps/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      url:
        description: "Website the apps open (e.g. https://cmgi-apps.de or your ngrok address)"
        default: "https://cmgi-apps.de"

permissions:
  contents: read

env:
  CMGI_APP_URL: ${{ inputs.url || 'https://cmgi-apps.de' }}

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cmgi-apps, eventpass, sermon-ai, bodyofchrist]
    defaults:
      run:
        working-directory: mobile-apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-apps/${{ matrix.app }}/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile-apps/${{ matrix.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android
          path: mobile-apps/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [cmgi-apps, eventpass, sermon-ai, bodyofchrist]
    defaults:
      run:
        working-directory: mobile-apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx cap sync ios
      - name: Build for the simulator (no signing)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Simulator app as a download (drag onto a running iOS Simulator on a Mac)
        run: cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/${{ matrix.app }}-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-simulator
          path: ${{ matrix.app }}-ios-simulator.zip
