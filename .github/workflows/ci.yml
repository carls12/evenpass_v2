name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [apps/eventpass/backend, apps/sermon-ai/backend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.app }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [apps/portal, apps/eventpass/frontend, apps/sermon-ai/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backends, frontends]
    env:
      EVENTPASS_ADMIN_PASSWORD: ci-only-password-not-secret
      SERMON_ADMIN_PASSWORD: ci-only-sermon-password
      POSTGRES_PASSWORD: ci-only-postgres-password
      BODYOFCHRIST_DB_PASSWORD: ci-only-boc-db-password
      HTTP_PORT: 8080
      HTTPS_PORT: 8443
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for health checks
        run: infrastructure/deployment/healthcheck.sh
      - name: Smoke test routing
        run: |
          set -e
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/apps | grep -q '<div id="root">'            # SPA refresh
          curl -fsS http://localhost:8080/eventpass/ | grep -q '/eventpass/assets/'
          curl -fsS http://localhost:8080/eventpass/events/abc | grep -q '/eventpass/assets/'
          curl -fsS http://localhost:8080/api/eventpass/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/register/abc)" = 308
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/eventpass/events)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/eventpass/docs)" = 404
          curl -fsS http://localhost:8080/sermon-ai/sermons/abc | grep -q '/sermon-ai/assets/'
          curl -fsS http://localhost:8080/api/sermon-ai/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/sermon-ai/sermons)" = 401
          curl -fsSI http://localhost:8080/ | grep -qi 'microphone=(self)'
          # Body of Christ: route exists (redirect, then proxy) but the app is not enabled in CI -> 502, not the portal.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/bodyofchrist)" = 308
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/bodyofchrist/login)" = 502
      - name: Compose file valid with Body of Christ enabled
        run: COMPOSE_PROFILES=bodyofchrist docker compose config --quiet
      - name: Central database - one isolated database per app, setup re-runnable
        run: |
          set -e
          q() { docker compose exec -T -e PGPASSWORD="$2" db psql -h 127.0.0.1 -U "$1" -d "$3" -Atc "$4"; }
          test "$(q bodyofchrist "$BODYOFCHRIST_DB_PASSWORD" bodyofchrist 'SELECT current_database()')" = bodyofchrist
          q bodyofchrist "$BODYOFCHRIST_DB_PASSWORD" bodyofchrist 'CREATE TABLE ci_probe(id int); DROP TABLE ci_probe;'
          ! q bodyofchrist "$BODYOFCHRIST_DB_PASSWORD" postgres 'SELECT 1' 2>/dev/null   # no access to other databases
          ! q bodyofchrist wrong-password bodyofchrist 'SELECT 1' 2>/dev/null
          docker compose run --rm db-setup   # idempotent second run
      - name: Data survives a restart
        run: |
          set -e
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/eventpass/login -H 'Content-Type: application/json' -d "{\"password\":\"$EVENTPASS_ADMIN_PASSWORD\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS -X POST http://localhost:8080/api/eventpass/events -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"CI Event","location":"CI","start_date":"2026-01-01","end_date":"2026-01-01"}'
          docker compose down
          docker compose up -d
          infrastructure/deployment/healthcheck.sh
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/eventpass/login -H 'Content-Type: application/json' -d "{\"password\":\"$EVENTPASS_ADMIN_PASSWORD\"}" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS http://localhost:8080/api/eventpass/events -H "Authorization: Bearer $TOKEN" | grep -q 'CI Event'
      - name: Backup script
        run: |
          set -e
          BACKUP_DEST=$RUNNER_TEMP/backups infrastructure/deployment/backup.sh
          ls $RUNNER_TEMP/backups/*.tar.gz $RUNNER_TEMP/backups/postgres-bodyofchrist-*.dump $RUNNER_TEMP/backups/postgres-globals-*.sql
      - if: failure()
        run: docker compose logs
