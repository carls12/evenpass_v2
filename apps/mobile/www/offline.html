<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CMGI Apps</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: linear-gradient(180deg, #f3f8ff, #fff); color: #15304f; text-align: center; padding: 24px; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 18px 0 8px; color: #0b2a55; }
    p { color: #5f7593; line-height: 1.6; max-width: 320px; margin: 0 auto 22px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 14px 26px; background: #1764d8; color: #fff; }
    .logo { width: 64px; height: 64px; border-radius: 18px; background: #e6f0ff; display: grid; place-items: center; margin: 0 auto; font-size: 30px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">📶</div>
    <h1>No connection</h1>
    <p>CMGI Apps needs the internet. Recordings that were already saved on this phone are kept and upload later.<br><br>Keine Verbindung – bitte Internet prüfen.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
